<style>
:root{
  --bg:#ECECEA; --ink:#111111; --sub:#7A7A7A; --faint:#BDBDBA; --rule:#B9B9B6; --soft:#DDDDDA;
  --acc:#D5452B; --onAcc:#FFFFFF;
  --font:"Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
html{overscroll-behavior-y:none; background:var(--bg);}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font);
  -webkit-font-smoothing:antialiased; min-height:100%; overscroll-behavior-y:none;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px);
  letter-spacing:-.01em;
}
button{font:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer; text-align:left;}
.wrap{max-width:520px; margin:0 auto;}
.pad{padding:0 22px;}
.num{font-variant-numeric:tabular-nums;}
.rule{height:1px; background:var(--rule);}

/* top bar */
.top{display:flex; align-items:center; justify-content:space-between; padding:22px 22px 0;}
.logo{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:800; letter-spacing:.02em; text-transform:uppercase;}
.logo i{width:22px; height:22px; border-radius:50%; border:4px solid var(--ink); position:relative; flex:0 0 auto;}
.logo i::after{content:""; position:absolute; right:-6px; bottom:-6px; width:9px; height:9px; background:var(--acc); transform:rotate(45deg); border-radius:1px;}
.logo b{color:var(--acc);}
.clock{background:var(--ink); color:#fff; font-size:14px; font-weight:600; padding:9px 14px; border-radius:6px; display:flex; align-items:center; gap:8px;}
.clock span.d{width:6px; height:6px; border-radius:50%; background:var(--acc); animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* next */
.nextHead{display:flex; justify-content:space-between; align-items:flex-start; padding:34px 22px 0;}
.nextHead .a{font-size:24px; font-weight:700; line-height:1.15;}
.nextHead .b{font-size:24px; font-weight:400; line-height:1.15; margin-top:2px;}
.nextHead svg{width:22px; height:22px; margin-top:4px;}
.big{display:block; width:100%; text-align:center; font-size:96px; font-weight:200; letter-spacing:-.05em; line-height:1; margin:22px 0 16px;}
.heroInv{width:44px; height:44px; border-radius:50%; border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center; flex:0 0 auto; margin-left:12px; transition:transform .4s cubic-bezier(.3,1.3,.5,1);}
.heroInv svg{width:18px; height:18px;}
.heroInv.spin{transform:rotate(180deg);}
.rt{font-size:17px; color:var(--sub); margin-top:6px; line-height:1.3;}
.rt b{color:var(--ink); font-weight:500;}
.heroAct{display:flex; justify-content:center; align-items:center; gap:10px; padding:0 22px; flex-wrap:wrap;}
.inPill{font-size:14px; font-weight:600; color:var(--acc); border:1.5px solid var(--acc); border-radius:30px; padding:9px 14px;}
.stopsBtn{display:flex; align-items:center; gap:6px; background:var(--ink); color:#fff; font-size:14px; font-weight:600; padding:10px 14px; border-radius:30px;}
.stopsBtn svg{width:14px; height:14px;}
.stopsBtn:active{opacity:.8;}
.tlLabel{font-size:11px; font-weight:600; color:var(--sub); text-transform:uppercase; letter-spacing:.08em; padding:34px 22px 10px;}
.big.none{font-size:34px; font-weight:300; letter-spacing:-.02em; margin:30px 0 18px;}

/* timeline */
.tl{position:relative; height:74px; margin:0 0 6px;}
.tlDots{position:absolute; left:0; right:0; top:0; height:20px;}
.tlDots i{position:absolute; top:6px; width:6px; height:6px; margin-left:-3px; border-radius:50%; background:var(--ink);}
.tlDots i.past{background:var(--faint);}
.tlDots i.nx{background:var(--acc); width:8px; height:8px; margin-left:-4px; top:5px;}
.tlBar{position:absolute; left:0; right:0; top:26px; height:14px;
  background:repeating-linear-gradient(90deg, #D4D4D1 0 6px, #E2E2DF 6px 9px);}
.tlFill{position:absolute; left:0; top:26px; height:14px; background:var(--ink);}
.tlNow{position:absolute; top:18px; width:1.5px; height:30px; background:var(--ink); margin-left:-.75px;}
.tlPill{position:absolute; top:52px; transform:translateX(-50%); background:var(--acc); color:#fff; font-size:10.5px; font-weight:700; letter-spacing:.06em; padding:4px 11px; border-radius:20px; white-space:nowrap;}
.tlHours{display:flex; justify-content:space-between; padding:0 22px; font-size:10.5px; color:var(--sub); margin-top:2px;}

/* section header */
.sec{display:flex; align-items:flex-end; justify-content:space-between; padding:40px 22px 12px;}
.sec .ttl{font-size:24px; font-weight:700;}
.sec .m{font-size:12px; font-weight:600; color:var(--acc); letter-spacing:.02em;}

/* lines menu */
.row{display:flex; gap:12px; width:100%; padding:14px 22px 15px; border-bottom:1px solid var(--rule); align-items:flex-start;}
.row .n{font-size:12px; font-weight:400; color:var(--ink); letter-spacing:.08em; line-height:1; font-variant-numeric:tabular-nums; writing-mode:vertical-rl; transform:rotate(180deg); align-self:stretch; display:flex; align-items:center; justify-content:center; min-width:14px;}
.row .name{flex:1; font-size:21px; font-weight:400; line-height:1.18; letter-spacing:-.02em;}
.row .via{display:inline-block; margin-top:8px; font-size:11.5px; border:1px solid var(--ink); border-radius:20px; padding:3px 10px;}
.row:not(.on):active{background:var(--soft);}
.row.on .n{color:var(--acc);}
.route{flex:1; min-width:0;}
.route .k{font-size:11px; font-weight:600; color:var(--acc); text-transform:uppercase; letter-spacing:.08em;}
.route .v{font-size:24px; font-weight:400; line-height:1.15; letter-spacing:-.025em; color:var(--acc); transition:opacity .18s, transform .22s;}
.route .gap{height:10px;}
.fade .v{opacity:0; transform:translateY(3px);}
.inv{flex:0 0 auto; align-self:center; background:var(--ink); color:#fff; font-size:14px; font-weight:600; padding:12px 14px; border-radius:6px; display:flex; align-items:center; gap:7px;}
.inv svg{width:15px; height:15px; transition:transform .4s cubic-bezier(.3,1.3,.5,1);}
.inv.spin svg{transform:rotate(180deg);}
.inv:active{opacity:.8;}

/* segmented pill */
.seg{position:relative; display:grid; grid-template-columns:repeat(3,1fr); background:var(--ink); border-radius:40px; padding:5px; margin:0 22px;}
.segThumb{position:absolute; top:5px; bottom:5px; left:5px; width:calc((100% - 10px)/3); border-radius:40px; background:#F4F4F2; transition:transform .32s cubic-bezier(.3,1.2,.5,1);}
.segBtn{position:relative; z-index:1; text-align:center; padding:12px 4px; font-size:14px; font-weight:500; color:#fff; transition:color .2s;}
.segBtn.active{color:var(--ink);}
.segBtn .td{display:block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--acc); margin-top:1px;}
.segBtn{min-height:48px;}

/* times */
.grid{display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--rule); margin-top:18px;}
.t{padding:18px 0 17px; text-align:center; font-size:19px; font-weight:400; border-bottom:1px solid var(--rule); border-right:1px solid var(--rule);}
.t:nth-child(4n){border-right:0;}
.t.past{color:var(--faint);}
.t.nx{color:var(--acc); font-weight:600; position:relative;}
.t.nx::after{content:""; position:absolute; left:50%; bottom:8px; width:5px; height:5px; margin-left:-2.5px; border-radius:50%; background:var(--acc);}
.t:active{background:var(--soft);}
.hint{font-size:12px; color:var(--sub); padding:14px 22px 0;}
.empty{padding:28px 22px; font-size:17px; color:var(--sub); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); margin-top:18px;}
.note{font-size:12px; color:var(--sub); line-height:1.5; padding:22px 22px 0;}
.note b{color:var(--acc); font-weight:600;}

/* sheet */
#ov{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s;}
#ov.show{opacity:1; pointer-events:auto;}
#sheet{width:100%; max-width:520px; background:var(--bg); border-radius:26px 26px 0 0; padding:18px 0 calc(24px + env(safe-area-inset-bottom,0px)); max-height:86vh; overflow-y:auto; transform:translateY(100%); transition:transform .4s cubic-bezier(.2,.9,.25,1);}
#ov.show #sheet{transform:translateY(0);}
.sTop{display:flex; justify-content:space-between; align-items:center; padding:0 22px;}
.sTop .k{font-size:12px; font-weight:600; color:var(--acc);}
.close{background:var(--ink); color:#fff; font-size:13px; font-weight:600; padding:9px 13px; border-radius:6px; display:flex; align-items:center; gap:8px;}
.close svg{width:11px; height:11px;}
.sBig{font-size:72px; font-weight:200; letter-spacing:-.05em; line-height:1; padding:18px 22px 6px;}
.sSub{font-size:14px; color:var(--sub); padding:0 22px 20px;}
.stop{display:flex; gap:12px; align-items:baseline; padding:13px 22px; border-top:1px solid var(--rule);}
.stop:last-child{border-bottom:1px solid var(--rule);}
.stop .n{font-size:10.5px; font-weight:600; min-width:14px;}
.stop .nm{flex:1; font-size:18px; font-weight:400; letter-spacing:-.015em;}
.stop .tm{font-size:17px;}
.stop.end .nm, .stop.end .tm, .stop.end .n{color:var(--acc);}

/* next block */
.nx{display:block; width:100%; padding:20px 22px 22px; border-bottom:1px solid var(--rule);}
.nx:active{background:var(--soft);}
.nxTop{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.nxTime{font-size:76px; font-weight:200; letter-spacing:-.05em; line-height:.95;}
.nxIn{background:var(--acc); color:#fff; font-size:15px; font-weight:600; padding:10px 14px; border-radius:30px; white-space:nowrap;}
.nxRoute{font-size:16px; color:var(--sub); margin-top:12px; line-height:1.35;}
.nxRoute b{color:var(--ink); font-weight:500;}
.nxAfter{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:16px; font-size:13px; color:var(--sub);}
.nxAfter span.c{border:1px solid var(--ink); color:var(--ink); border-radius:20px; padding:4px 11px; font-size:14px;}
.nxNone{font-size:24px; font-weight:300; letter-spacing:-.02em;}
.nxNone small{display:block; font-size:14px; color:var(--sub); margin-top:6px; letter-spacing:0;}
.nxLine{display:inline-block; font-size:12px; font-weight:700; color:#fff; background:var(--ink); border-radius:5px; padding:3px 7px; margin-right:8px; vertical-align:1px;}
.logo{font-size:26px !important; font-weight:800 !important; letter-spacing:-.03em !important; text-transform:none !important; gap:0 !important;}
.logo b{color:#C4552D !important; font-weight:800;}

/* ===== tabs ===== */
.tabs{position:relative; display:grid; grid-template-columns:1fr 1fr; background:var(--ink); border-radius:40px; padding:5px; margin:22px 22px 0;}
.tabThumb{position:absolute; top:5px; bottom:5px; left:5px; width:calc((100% - 10px)/2); border-radius:40px; background:#F4F4F2; transition:transform .32s cubic-bezier(.3,1.2,.5,1);}
.tab{position:relative; z-index:1; text-align:center; padding:12px 4px; font-size:14px; font-weight:600; color:#fff; transition:color .2s;}
.tab.active{color:var(--ink);}
.view[hidden]{display:none;}

/* ===== porto planner ===== */
.pDir{display:flex; gap:12px; width:100%; padding:16px 22px 17px; border-bottom:1px solid var(--rule); align-items:center;}
.pPer{display:flex; gap:8px; padding:14px 22px 0; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--sub);}
.pPer button{font-size:13px; font-weight:500; border:1px solid var(--ink); border-radius:20px; padding:6px 12px;}
.pPer button.on{background:var(--ink); color:#fff;}
.best{display:block; width:100%; padding:20px 22px 22px; border-bottom:1px solid var(--rule);}
.best:active{background:var(--soft);}
.bestK{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--acc); margin-bottom:6px;}
.bestArr{font-size:17px; margin-top:12px;}
.bestArr b{font-weight:600;}
.legs{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:12px; font-size:13px; color:var(--sub);}
.chip{display:inline-flex; align-items:center; font-size:12px; font-weight:700; color:#fff; background:var(--ink); border-radius:5px; padding:3px 7px; font-variant-numeric:tabular-nums;}
.chip.o{background:transparent; color:var(--ink); border:1px solid var(--ink); font-weight:500;}
.legs .ar{color:var(--ink);}
.opt{display:flex; gap:12px; width:100%; padding:16px 22px; border-bottom:1px solid var(--rule); align-items:center;}
.opt:active{background:var(--soft);}
.opt .tt{font-size:24px; font-weight:300; letter-spacing:-.03em; white-space:nowrap;}
.opt .tt span{color:var(--sub); font-size:18px; margin:0 6px;}
.opt .mid{flex:1; min-width:0;}
.opt .legs{margin-top:6px;}

const DAYS = {du:"Dias úteis", sab:"Sábado", dom:"Domingo"};
const SWAP = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16"/><path d="M3 8l4-4 4 4"/><path d="M17 20V4"/><path d="M21 16l-4 4-4-4"/></svg>`;
const order = Object.keys(DATA);
const T0 = 6*60, T1 = 23*60; // timeline 06h–23h
let state = {line:"1223", dir:"ida", day:today(), spin:false};

function today(){ const d=new Date().getDay(); return d===0?"dom":d===6?"sab":"du"; }
function nowMin(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }
function toMin(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function pad(n){ return String(n).padStart(2,"0"); }
function ends(d){ const p=d.label.split("→").map(s=>s.trim()); return p.length===2?p:[d.label,""]; }
function pct(m){ return Math.max(0, Math.min(100, (m-T0)/(T1-T0)*100)); }
function inTxt(d){ if(d<=0) return "Parte agora"; const h=Math.floor(d/60), m=d%60; return "Parte daqui a " + (h ? `${h}h${m?pad(m):""}` : `${m} min`); }

function renderNext(){
  const dirData = DATA[state.line].dirs[state.dir];
  const trips = dirData.trips[today()] || [];
  const now = nowMin();
  const i = trips.findIndex(t=>toMin(t[0])>=now);
  const [ra,rb] = ends(dirData);
  document.getElementById("nxDay").textContent = "Hoje · " + DAYS[today()];
  const box = document.getElementById("nx");
  if(i===-1){
    box.innerHTML = `<div class="nxNone">${trips.length ? "Não há mais partidas hoje" : "Esta linha não circula hoje"}<small>Consulta os horários abaixo.</small></div>`;
    box.onclick = null; return;
  }
  const d = toMin(trips[i][0]) - now, h = Math.floor(d/60), m = d%60;
  const inTxt = d<=0 ? "Agora" : "daqui a " + (h ? `${h}h${m?pad(m):""}` : `${m} min`);
  box.innerHTML = `
    <div class="nxTop"><span class="nxTime num">${trips[i][0]}</span><span class="nxIn">${inTxt}</span></div>
    <div class="nxRoute"><span class="nxLine">Linha ${DATA[state.line].title}</span><b>${ra}</b> → <b>${rb}</b></div>`;
  box.onclick = ()=> openStops(dirData, trips[i]);
}

function renderLines(){
  const box = document.getElementById("lines");
  box.innerHTML = order.map((k,idx)=>{
    const l = DATA[k], n = l.title;
    if(k===state.line){
      const [a,b] = ends(l.dirs[state.dir]);
      return `<div class="row on"><span class="n">${n}</span>
        <div class="route" id="route"><div class="k">De</div><div class="v">${a}</div><div class="gap"></div><div class="k">Para</div><div class="v">${b}</div></div>
        <button class="inv ${state.spin?"spin":""}" id="swap">Inverter ${SWAP}</button></div>`;
    }
    return `<button class="row" data-k="${k}"><span class="n">${n}</span>
      <span class="name">${l.name.replace(" - "," ↔ ")}${l.tagline?`<br><span class="via">${l.tagline}</span>`:""}</span></button>`;
  }).join("");
  box.querySelectorAll("button.row").forEach(b=> b.onclick = ()=>{
    state.line=b.dataset.k; state.dir="ida"; state.spin=false; renderAll();

  });
  document.getElementById("swap").onclick = ()=>{
    state.dir = state.dir==="ida"?"volta":"ida"; state.spin=!state.spin;
    if(navigator.vibrate) navigator.vibrate(8);
    document.getElementById("swap").classList.toggle("spin", state.spin);
    document.getElementById("route").classList.add("fade");
    setTimeout(renderAll, 170);
  };
}

function renderSeg(){
  const seg = document.getElementById("seg");
  seg.querySelectorAll(".segBtn").forEach(b=>b.remove());
  const keys = Object.keys(DAYS);
  keys.forEach(d=>{
    const b = document.createElement("button");
    b.className = "segBtn" + (d===state.day?" active":"");
    b.innerHTML = DAYS[d] + (d===today() ? '<span class="td">hoje</span>' : "");
    b.onclick = ()=>{ state.day=d; renderTimes(); };
    seg.appendChild(b);
  });
  document.getElementById("thumb").style.transform = `translateX(${keys.indexOf(state.day)*100}%)`;
}

function renderTimes(){
  renderSeg();
  const line = DATA[state.line], dirData = line.dirs[state.dir];
  const trips = dirData.trips[state.day] || [];
  document.getElementById("note").innerHTML = line.note ? `<b>Nota</b> — ${line.note}` : "";
  document.getElementById("count").textContent = trips.length ? `${trips.length} horários` : "";
  const box = document.getElementById("content");
  if(!trips.length){ box.innerHTML = `<div class="empty">Sem serviço neste dia.</div>`; return; }
  const now = nowMin(), isToday = state.day===today();
  const nx = isToday ? trips.findIndex(t=>toMin(t[0])>=now) : -1;
  box.innerHTML = `<div class="grid">` + trips.map((t,i)=>{
    const past = isToday && (nx===-1 || i<nx);
    return `<button class="t num ${past?"past":""} ${i===nx?"nx":""}" data-i="${i}">${t[0]}</button>`;
  }).join("") + `</div><div class="hint">Toca numa hora para ver as paragens</div>`;
  box.querySelectorAll("[data-i]").forEach(b=> b.onclick = ()=> openStops(dirData, trips[+b.dataset.i]));
}

function renderAll(){ renderNext(); renderLines(); renderTimes(); }

function closeSheet(){ document.getElementById("ov").classList.remove("show"); }
function openStops(dirData, trip){
  const stops = dirData.stops;
  document.getElementById("sK").textContent = `Linha ${DATA[state.line].title} · Partida`;
  document.getElementById("sT").textContent = trip[0];
  document.getElementById("sS").textContent = `${dirData.label} · ${stops.length} paragens`;
  document.getElementById("stops").innerHTML = stops.map((n,i)=>
    `<div class="stop ${i===0||i===stops.length-1?"end":""}"><span class="n">${pad(i+1)}</span><span class="nm">${n}</span><span class="tm num">${trip[i]}</span></div>`).join("");
  document.getElementById("ov").classList.add("show");
}
document.getElementById("close").onclick = closeSheet;
document.getElementById("ov").addEventListener("click", e=>{ if(e.target.id==="ov") closeSheet(); });
(function(){
  const s=document.getElementById("sheet"); let y0=null, dy=0;
  s.addEventListener("touchstart",e=>{ if(s.scrollTop<=0){ y0=e.touches[0].clientY; dy=0; s.style.transition="none"; } },{passive:true});
  s.addEventListener("touchmove",e=>{ if(y0===null) return; dy=Math.max(0,e.touches[0].clientY-y0); s.style.transform=`translateY(${dy}px)`; },{passive:true});
  s.addEventListener("touchend",()=>{ if(y0===null) return; s.style.transition=""; s.style.transform=""; if(dy>90) closeSheet(); y0=null; });
})();


/* =================== IR AO PORTO =================== */
/* Linha 1220 (Oliveira de Azeméis ⇄ Porto) — só dias úteis. p: "esc"=período escolar, "fer"=férias escolares, "all"=sempre */
const L1220_VOLTA = { line:"1220", stops:["Parque das Camélias (CCT)","D. João II (Metro)","Praça José da Costa (OAZ)"],
  trips:[ {p:"esc", t:["10:30","10:40","11:25"]}, {p:"fer", t:["11:00","11:10","11:55"]}, {p:"fer", t:["12:00","12:10","12:50"]}, {p:"all", t:["17:00","17:10","17:50"]} ] };
/* Ligações Oliveira de Azeméis → Vale de Cambra (dias úteis). Partem da EBS Soares de Basto e passam na Praça José da Costa pouco depois (hora estimada: off). */
const OAZ_VDC = [
  { line:"1218", off:2, stops:["Praça José da Costa (OAZ)","Hospital S. Miguel","GNR - Centro de Saúde (OAZ)","EBS Ferreira de Castro","Escola Bustelo","Arrifaninha","Vale de Cambra (CCT)"],
    ebs:["08:10","10:25","11:05","13:40","15:00","18:30"],
    trips:[["08:15","08:17","08:19","08:22","08:30","08:40"],["10:30","10:32","10:34","10:37","10:45","10:55"],["11:10","11:12","11:14","11:17","11:25","11:35"],["13:45","13:47","13:49","13:52","14:00","14:10"],["15:05","15:07","15:09","15:12","15:20","15:30"],["18:35","18:37","18:39","18:42","18:50","19:00"]] },
  { line:"1209", off:3, stops:["Praça José da Costa (OAZ)","Hospital S. Miguel","GNR - Centro de Saúde (OAZ)","EBS Ferreira de Castro","Escola Bustelo","Pindelo","Vermoim","Barreiro","Salgueiros","Baralhas","Vale de Cambra (CCT)"],
    ebs:["14:35","17:05","18:35"],
    trips:[["14:42","14:44","14:46","14:49","14:52","15:00","15:08","15:10","15:13","15:18"],["17:12","17:14","17:16","17:19","17:22","17:30","17:38","17:40","17:43","17:48"],["18:42","18:44","18:46","18:49","18:52","19:00","19:08","19:10","19:13","19:18"]] }
];
const MIN_XFER = 5; // minutos mínimos para a troca
const TIGHT = 10;   // abaixo disto, avisar que a troca é apertada
let pstate = { dir:"ida", per:"esc", spin:false };

function fromMin(m){ return pad(Math.floor(m/60))+":"+pad(m%60); }
function durTxt(m){ const h=Math.floor(m/60), r=m%60; return h ? `${h}h${r?pad(r):""}` : `${r} min`; }

function dayKey(date){ const d=date.getDay(); return d===0?"dom":d===6?"sab":"du"; }
function portoOptions(dayType){
  const opts=[];
  const d1223 = DATA["1223"].dirs[pstate.dir];
  (d1223.trips[dayType]||[]).forEach(t=> opts.push({dep:toMin(t[0]), arr:toMin(t[t.length-1]), legs:[{line:"1223", stops:d1223.stops, t}], xfer:null}));
  if(pstate.dir==="ida"){
    // Vale de Cambra → S. João da Madeira (1215) + S. João da Madeira → Porto (1410 Campanhã / 2026 Camélias)
    const a = DATA["1215"].dirs.ida;
    (a.trips[dayType]||[]).forEach(t1=>{
      const arrSJM = toMin(t1[t1.length-1]);
      let best=null;
      ["1410","2026"].forEach(k=>{
        const d = DATA[k].dirs.ida;
        (d.trips[dayType]||[]).forEach(t2=>{
          const dep2 = toMin(t2[0]);
          if(dep2 >= arrSJM + MIN_XFER){
            const arr = toMin(t2[t2.length-1]);
            if(!best || arr<best.arr || (arr===best.arr && dep2>best.dep2)) best={k, d, t2, dep2, arr};
          }
        });
      });
      if(best) opts.push({dep:toMin(t1[0]), arr:best.arr,
        legs:[{line:"1215", stops:a.stops, t:t1}, {line:best.k, stops:best.d.stops, t:best.t2}],
        xfer:{kind:"sjm", at:"S. João da Madeira (CCT)", short:"S. João da Madeira", wait:best.dep2-arrSJM, line:best.k}});
    });
  } else {
    // Porto (1410 Campanhã / 2026 Camélias) → S. João da Madeira + 1215 → Vale de Cambra
    const c = DATA["1215"].dirs.volta;
    ["1410","2026"].forEach(k=>{
      const d = DATA[k].dirs.volta;
      (d.trips[dayType]||[]).forEach(t1=>{
        const arrSJM = toMin(t1[t1.length-1]);
        let best=null;
        (c.trips[dayType]||[]).forEach(t2=>{
          const dep2=toMin(t2[0]);
          if(dep2 >= arrSJM + MIN_XFER){ const arr=toMin(t2[t2.length-1]); if(!best || arr<best.arr) best={t2,dep2,arr}; }
        });
        if(best) opts.push({dep:toMin(t1[0]), arr:best.arr,
          legs:[{line:k, stops:d.stops, t:t1}, {line:"1215", stops:c.stops, t:best.t2}],
          xfer:{kind:"sjm", at:"S. João da Madeira (CCT)", short:"S. João da Madeira", wait:best.dep2-arrSJM, line:"1215"}});
      });
    });
  }
  const keep = opts.filter(o=> !opts.some(q=> q!==o && q.dep>=o.dep && q.arr<=o.arr && (q.dep>o.dep || q.arr<o.arr)));
  // se duas opções forem iguais (mesma partida e chegada), fica a direta
  const uniq = keep.filter((o,i)=> !keep.some((q,j)=> j<i && q.dep===o.dep && q.arr===o.arr));
  return uniq.sort((a,b)=>a.dep-b.dep);
}
function destName(o){ const L = pstate.dir==="ida" ? o.legs[o.legs.length-1] : o.legs[0]; const n = pstate.dir==="ida" ? L.stops[L.stops.length-1] : L.stops[0];
  return /Campanh/.test(n) ? "Porto (Campanhã)" : /Camélias/.test(n) ? "Porto (Camélias)" : n.replace(" (CCT)",""); }

function legsHTML(o){
  if(!o.xfer) return `<span class="chip">${o.legs[0].line}</span> Direto`;
  return `<span class="chip">${o.legs[0].line}</span> → <span class="chip">${o.legs[1].line}</span> troca em ${o.xfer.short}${o.xfer.wait<TIGHT?` <span class="tight">Troca apertada · ${o.xfer.wait} min</span>`:""}`;
}

function nextDayWithService(){
  const base=new Date();
  for(let k=1;k<=7;k++){ const d=new Date(base); d.setDate(base.getDate()+k); const key=dayKey(d); if(portoOptions(key).length) return {k, wd:d.getDay(), key}; }
}

function renderPorto(){
  const now=nowMin(), dt=today();
  document.getElementById("pDay").textContent = "Hoje · " + DAYS[dt];
  const [a,b] = pstate.dir==="ida" ? ["Vale de Cambra","Porto"] : ["Porto","Vale de Cambra"];
  document.getElementById("pDirBox").innerHTML = `<div class="pDir row on" style="border-bottom:1px solid var(--rule)">
    <div class="route" id="pRoute"><div class="k">De</div><div class="v">${a}</div><div class="gap"></div><div class="k">Para</div><div class="v">${b}</div></div>
    <button class="inv ${pstate.spin?"spin":""}" id="pSwap">Inverter ${SWAP}</button></div>`;
  document.getElementById("pSwap").onclick = ()=>{
    pstate.dir = pstate.dir==="ida"?"volta":"ida"; pstate.spin=!pstate.spin;
    if(navigator.vibrate) navigator.vibrate(8);
    document.getElementById("pSwap").classList.toggle("spin", pstate.spin);
    document.getElementById("pRoute").classList.add("fade");
    setTimeout(renderPorto, 170);
  };
  document.getElementById("pPer").innerHTML = "";

  let opts = portoOptions(dt).filter(o=>o.dep>=now);
  let dayLbl = "", isToday = true;
  if(!opts.length){
    const nd = nextDayWithService(); isToday=false;
    dayLbl = !nd ? "" : nd.k===1 ? "amanhã" : ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"][nd.wd];
    opts = nd ? portoOptions(nd.key) : [];
  }
  const best = document.getElementById("pBest"), list=document.getElementById("pList");
  if(!opts.length){ best.innerHTML = `<div class="pNone"><div class="a">Sem ligações</div></div>`; list.innerHTML=""; return; }
  const o0 = opts[0];
  const d = o0.dep-now, h=Math.floor(d/60), m=d%60;
  const inTxt = !isToday ? dayLbl : d<=0 ? "Agora" : "daqui a " + (h ? `${h}h${m?pad(m):""}` : `${m} min`);
  best.innerHTML = `${!isToday ? `<div class="pNone" style="border-bottom:0;padding-bottom:0"><div class="a">${portoOptions(dt).length?"Hoje já não há mais":"Hoje não há ligações"}</div><div class="b">A primeira opção é ${dayLbl}.</div></div>`:""}
    <button class="best" id="bestBtn">
      <div class="bestK">${isToday ? "A melhor opção" : "Primeira de " + dayLbl}</div>
      <div class="nxTop"><span class="nxTime num">${fromMin(o0.dep)}</span><span class="nxIn">${inTxt}</span></div>
      <div class="bestArr">${pstate.dir==="ida" ? `Chegas a ${destName(o0)} às <b class="num">${fromMin(o0.arr)}</b>` : `Sai de ${destName(o0)} · chegas às <b class="num">${fromMin(o0.arr)}</b>`} · ${durTxt(o0.arr-o0.dep)}</div>
      <div class="legs">${legsHTML(o0)}</div>
    </button>`;
  document.getElementById("bestBtn").onclick = ()=> openTrip(o0);
  const rest = opts.slice(1);
  document.getElementById("pCount").textContent = rest.length ? `${rest.length} ${isToday?"hoje":dayLbl}` : "";
  list.innerHTML = rest.length ? rest.map((o,i)=>`<button class="opt" data-i="${i+1}">
      <div class="mid"><div class="tt num">${fromMin(o.dep)}<span>→</span>${fromMin(o.arr)}</div><div class="legs">${legsHTML(o)}</div></div>
      <div class="du">${durTxt(o.arr-o.dep)}<br><span style="color:var(--ink)">${pstate.dir==="ida"?"":"de "}${destName(o).replace("Porto (","").replace(")","")}</span></div></button>`).join("")
    : `<div class="pNone"><div class="b">Não há mais opções ${isToday?"hoje":dayLbl}.</div></div>`;
  list.querySelectorAll(".opt").forEach(x=> x.onclick=()=> openTrip(opts[+x.dataset.i]));
  document.getElementById("pNote").innerHTML = pstate.dir==="volta"
    ? `<b>Nota</b> — Direto pela linha 1223 (Camélias), com troca em <b style="color:var(--ink)">S. João da Madeira (CCT)</b> (1410 desde Campanhã ou 2026 desde as Camélias, depois o 1215). As trocas têm pelo menos ${MIN_XFER} min de margem; abaixo de ${TIGHT} min aparece um aviso, porque um atraso por trânsito pode fazer perder a ligação.`
    : `<b>Nota</b> — Direto pela linha 1223 ou com troca em <b style="color:var(--ink)">S. João da Madeira (CCT)</b>: o 1215 termina no terminal e o 1410 (Campanhã) ou o 2026 (Camélias) partem do mesmo terminal. As trocas têm pelo menos ${MIN_XFER} min de margem; abaixo de ${TIGHT} min aparece um aviso, porque um atraso por trânsito pode fazer perder a ligação. Alguns horários do 1215 em dias úteis são só em período escolar.`;
}

function openTrip(o){
  document.getElementById("sK").textContent = o.xfer ? "Viagem com 1 troca" : "Viagem direta";
  document.getElementById("sT").innerHTML = `<span style="font-size:56px">${fromMin(o.dep)} <span style="color:var(--sub)">→</span> ${fromMin(o.arr)}</span>`;
  document.getElementById("sS").textContent = `${pstate.dir==="ida"?"Vale de Cambra":destName(o)} → ${pstate.dir==="ida"?destName(o):"Vale de Cambra"} · ${durTxt(o.arr-o.dep)}`;
  let html="";
  o.legs.forEach((L,li)=>{
    if(li===1){
      html += o.xfer.kind==="oaz"
        ? `<div class="xfer">Troca em <b>Praça José da Costa (OAZ)</b> — a mesma paragem onde sais.<br>Espera cerca de <b>${durTxt(o.xfer.wait)}</b>. O ${o.xfer.line} sai da EBS Soares de Basto às ${o.xfer.ebs} e passa na praça por volta das ${fromMin(o.xfer.pass)}.</div>`
        : `<div class="xfer">Troca em <b>${o.xfer.at}</b> — o ${o.xfer.line} parte do mesmo terminal onde sais.<br>Espera <b>${durTxt(o.xfer.wait)}</b>.${o.xfer.wait<TIGHT?`<div class="tightBox"><b>Atenção:</b> a margem é pequena. Se o primeiro autocarro se atrasar por causa do trânsito, podes perder a ligação. Considera apanhar uma opção mais cedo.</div>`:""}</div>`;
    }
    html += `<div class="legHead"><span class="chip">${L.line}</span>${L.stops[0].replace(" (CCT)","")} → ${L.stops.slice(-1)[0].replace(" (CCT)","")}</div>`;
    html += L.stops.map((n,i)=>`<div class="stop ${i===0||i===L.stops.length-1?"end":""}"><span class="n">${pad(i+1)}</span><span class="nm">${n}</span><span class="tm num">${L.est0&&i===0?'<span class="est">≈ </span>':''}${L.t[i]}</span></div>`).join("");
  });
  document.getElementById("stops").innerHTML = html;
  document.getElementById("ov").classList.add("show");
}

/* tabs */
function setTab(v){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.v===v));
  document.getElementById("tabThumb").style.transform = `translateX(${v==="porto"?100:0}%)`;
  document.getElementById("viewLinhas").hidden = v!=="linhas";
  document.getElementById("viewPorto").hidden = v!=="porto";
  if(v==="porto") renderPorto();
}
document.querySelectorAll(".tab").forEach(t=> t.onclick=()=>setTab(t.dataset.v));
setInterval(()=>{ if(!document.getElementById("viewPorto").hidden) renderPorto(); }, 30000);

function tick(){}
tick(); renderAll();
setInterval(()=>{ tick(); renderNext(); renderTimes(); }, 30000);
</script>
